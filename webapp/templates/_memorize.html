{% from "_icons.html" import icon %}
{# The verse of the day: one row on Today. Practice happens on the verse page. #}
{% macro memorize_row(v) %}
<section class="group">
  <h2 class="eyebrow">Memorizing</h2>
  <div class="list">
    <a class="row" href="{{ url_for('main.memorize') }}">
      <span class="row-main">
        <span class="row-title">{{ v.display_ref }}</span>
        <span class="row-sub">Tap to practice</span>
      </span>
      <span class="chev">{{ icon('chev', 16) }}</span>
    </a>
  </div>
</section>
{% endmacro %}
